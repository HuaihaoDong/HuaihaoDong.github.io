<meta charset="UTF-8">

<style>
  :root {
    --bg: #0B1120; --panel: #141d33; --panel-2: #1a2540;
    --line: #2a3a55; --accent: #c9a26b; --text: #e9e6e0;
    --sub: #a5acbd; --dim: #6b7488;
  }
  html, body { overflow-x: hidden; }
  body::before {
    content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      radial-gradient(1px 1px at 10% 18%, rgba(220,232,255,.5) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 30% 8%, rgba(240,244,255,.35) 50%, transparent 51%),
      radial-gradient(1px 1px at 50% 30%, rgba(220,232,255,.4) 50%, transparent 51%),
      radial-gradient(2px 2px at 72% 14%, rgba(186,208,255,.3) 50%, transparent 51%),
      radial-gradient(1px 1px at 88% 40%, rgba(240,244,255,.45) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 18% 70%, rgba(220,232,255,.35) 50%, transparent 51%),
      radial-gradient(1px 1px at 40% 88%, rgba(240,244,255,.4) 50%, transparent 51%),
      radial-gradient(1px 1px at 62% 60%, rgba(220,232,255,.3) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 80% 82%, rgba(186,208,255,.35) 50%, transparent 51%),
      radial-gradient(1px 1px at 94% 60%, rgba(240,244,255,.4) 50%, transparent 51%);
  }
  .section { position: relative; z-index: 1; padding-top: 100px; max-width: 860px; }

  .back {
    display: inline-block; margin-bottom: 20px;
    color: var(--sub); font-size: 14px; text-decoration: none;
  }
  .back:hover { color: var(--accent); }

  .detail { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .detail-cover { position: relative; aspect-ratio: 16/7; background: var(--panel-2); border-bottom: 1px solid var(--line); overflow: hidden; }
  .detail-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .detail-cover .cover-ph {
    width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
    color: var(--dim); font-size: 14px;
  }

  .detail-body { padding: 28px 30px 32px; }
  .detail-title {
    font-family: Consolas, "Courier New", "PingFang SC", monospace;
    font-size: 24px; letter-spacing: 1px; color: var(--text); margin-bottom: 14px;
  }
  /* 比分（足球比赛） */
  .match-score {
    display: flex; align-items: center; justify-content: center; gap: 18px;
    font-family: Consolas, "Courier New", "PingFang SC", monospace;
    margin: 6px 0 16px;
  }
  .match-score .ms-num {
    font-size: 46px; color: var(--text); letter-spacing: 2px;
    background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 10px; padding: 8px 26px; line-height: 1.2;
  }
  .match-score .ms-colon { font-size: 34px; color: var(--accent); }
  .detail-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; justify-content: center; }
  .detail-note { color: var(--sub); line-height: 1.9; font-size: 15px; }
  .detail-note p { margin-bottom: 14px; }

  .detail-sub {
    font-family: Consolas, "Courier New", "PingFang SC", monospace;
    font-size: 13px; letter-spacing: 2px; color: var(--accent);
    margin: 26px 0 12px;
  }
  /* 瀑布流：JS 按照片顺序从左到右放入最矮列（绝对定位），横向阅读顺序 = 编号顺序 */
  .detail-photos { position: relative; }
  .detail-photos .ph-item {
    position: absolute; top: 0; left: 0;
    width: calc((100% - 20px) / 3);
    min-height: 120px;
  }
  .detail-photos img {
    width: 100%; height: auto; border-radius: 8px; display: block;
    cursor: zoom-in; transition: opacity .15s;
  }
  .detail-photos img:hover { opacity: .88; }
  .detail-photos .ph {
    border-radius: 8px; background: var(--panel-2);
    border: 1px dashed var(--line); display: flex; align-items: center; justify-content: center;
    color: var(--dim); font-size: 12px;
    padding: 28px 12px;
  }
  .detail-videos video {
    width: 100%; max-height: 420px; border-radius: 8px; background: #000;
    border: 1px solid var(--line); margin-bottom: 12px;
  }
  .detail-videos iframe {
    width: 100%; aspect-ratio: 16/9; border: 1px solid var(--line);
    border-radius: 8px; background: #000; margin-bottom: 12px;
  }
  .detail-empty {
    border-radius: 8px; background: var(--panel-2); border: 1px dashed var(--line);
    padding: 24px; text-align: center; color: var(--dim); font-size: 13px;
  }

  @media (max-width: 768px) {
    .detail-photos .ph-item { width: calc((100% - 10px) / 2); }
    .detail-body { padding: 20px 18px 24px; }
    .detail-title { font-size: 20px; }
    .match-score .ms-num { font-size: 34px; padding: 6px 18px; }
  }
</style>
</head>

<main class="section">
  <a class="back" href="story.html" id="backLink">← 返回故事列表</a>
  <div id="detail"></div>
</main>

<script src="nav.js"></script>
<script src="tiger.js"></script>
<script src="album.js"></script>
<script>
(function () {
  var box = document.getElementById('detail');
  var params = new URLSearchParams(location.search);
  var id = params.get('id');
  // 数据源与返回目标可由 URL 参数指定，默认烛逢故事
  var dataFile = params.get('data') || 'activities.json';
  var backHref = params.get('back') || 'story.html';
  var backLabels = {
    'trek.html': '返回重装徒步',
    'football.html': '返回足球'
  };
  var back = document.getElementById('backLink');
  back.href = backHref;
  back.textContent = '← ' + (backLabels[backHref] || '返回故事列表');

  function fmtDate(d) { return d.replace(/-/g, '.'); }

  function noteHTML(note) {
    return note.split('\n').filter(function (s) { return s.trim(); })
      .map(function (s) { return '<p>' + s + '</p>'; }).join('');
  }

  // 照片条目兼容两种写法：字符串（旧格式，缩略图=原图）或 {src, thumb}
  function photoInfo(p) {
    if (typeof p === 'string' && p) return { src: p, thumb: p };
    if (p && typeof p.src === 'string' && p.src) {
      return { src: p.src, thumb: (p.thumb && typeof p.thumb === 'string') ? p.thumb : p.src };
    }
    return null;
  }

  // 视频条目两种写法：B 站嵌入 {"type":"bilibili","bvid":"BV..."} 或仓库直链 {"src":"..."}
  function videoHTML(v) {
    if (v && v.type === 'bilibili' && v.bvid) {
      return '<iframe src="//player.bilibili.com/player.html?bvid=' + v.bvid
        + '&page=1&high_quality=1&danmaku=0" scrolling="no" frameborder="0" allowfullscreen="true"></iframe>';
    }
    if (v && v.src) {
      return '<video controls preload="metadata" ' + (v.poster ? 'poster="' + v.poster + '"' : '') + '>'
        + '<source src="' + v.src + '" type="video/mp4">'
        + '你的浏览器不支持视频播放</video>';
    }
    return '';
  }

  function render(act) {
    var cover = act.cover
      ? '<img src="' + act.cover + '" alt="' + act.title + '">'
      : '<div class="cover-ph">封面待补充</div>';

    var photoList = (act.photos || []).map(photoInfo).filter(function (x) { return x; });
    var photos = photoList.length
      ? photoList.map(function (p, i) {
          return '<div class="ph-item"><img src="' + p.thumb + '" data-full="' + p.src + '" alt="' + act.title + ' 照片 ' + (i + 1) + '" loading="lazy"></div>';
        }).join('')
      : '<div class="detail-empty">照片待补充</div>';

    var videos = act.videos && act.videos.length && act.videos.some(function (v) { return videoHTML(v); })
      ? act.videos.map(videoHTML).join('')
      : '<div class="detail-empty">视频待补充</div>';

    // meta 标签：仅渲染有值的字段（比赛详情没有天气）
    var meta = '';
    if (act.date) meta += '<span class="tag">📅 ' + fmtDate(act.date) + '</span>';
    if (act.opponent) meta += '<span class="tag">⚔ ' + act.opponent + '</span>';
    if (act.location) meta += '<span class="tag">📍 ' + act.location + '</span>';
    if (act.weather) meta += '<span class="tag">🌤 ' + act.weather + '</span>';

    // 比分（足球比赛）："3:1" → 大比分展示
    var score = '';
    if (act.score) {
      var parts = act.score.split(':');
      score = '<div class="match-score">'
        + '<span class="ms-num">' + (parts[0] || '') + '</span>'
        + '<span class="ms-colon">:</span>'
        + '<span class="ms-num">' + (parts[1] || '') + '</span>'
        + '</div>';
    }

    box.innerHTML = '<article class="detail">'
      + '<div class="detail-cover">' + cover + '</div>'
      + '<div class="detail-body">'
      + '<h1 class="detail-title">' + act.title + '</h1>'
      + score
      + '<div class="detail-meta">' + meta + '</div>'
      + (act.note ? '<div class="detail-note">' + noteHTML(act.note) + '</div>' : '')
      + '<div class="detail-sub">照片' + (photoList.length ? ' · ' + photoList.length + ' 张' : '') + '</div>'
      + '<div class="detail-photos">' + photos + '</div>'
      + '<div class="detail-sub">视频</div>'
      + '<div class="detail-videos">' + videos + '</div>'
      + '</div></article>';

    Album.init(box.querySelector('.detail-photos'), { masonry: true });
  }

  fetch(dataFile)
    .then(function (r) { return r.json(); })
    .then(function (acts) {
      var act = acts.find(function (a) { return a.id === id; });
      if (act) { render(act); }
      else { box.innerHTML = '<div class="detail-empty">活动不存在或已删除</div>'; }
    })
    .catch(function () {
      box.innerHTML = '<div class="detail-empty">数据加载失败，请稍后再试</div>';
    });
})();
</script>
</body>
