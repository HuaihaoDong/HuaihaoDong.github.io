<title>活动详情 | Tiger Captain</title>

<link rel="stylesheet" href="common.css">
<style>
  :root {
    --bg: #0B1120; --panel: #141d33; --panel-2: #1a2540;
    --line: #2a3a55; --accent: #c9a26b; --text: #e9e6e0;
    --sub: #a5acbd; --dim: #6b7488;
  }
  html, body { overflow-x: hidden; }
  body::before {
    content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      radial-gradient(1px 1px at 10% 18%, rgba(220,232,255,.5) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 30% 8%, rgba(240,244,255,.35) 50%, transparent 51%),
      radial-gradient(1px 1px at 50% 30%, rgba(220,232,255,.4) 50%, transparent 51%),
      radial-gradient(2px 2px at 72% 14%, rgba(186,208,255,.3) 50%, transparent 51%),
      radial-gradient(1px 1px at 88% 40%, rgba(240,244,255,.45) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 18% 70%, rgba(220,232,255,.35) 50%, transparent 51%),
      radial-gradient(1px 1px at 40% 88%, rgba(240,244,255,.4) 50%, transparent 51%),
      radial-gradient(1px 1px at 62% 60%, rgba(220,232,255,.3) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 80% 82%, rgba(186,208,255,.35) 50%, transparent 51%),
      radial-gradient(1px 1px at 94% 60%, rgba(240,244,255,.4) 50%, transparent 51%);
  }
  .section { position: relative; z-index: 1; padding-top: 100px; max-width: 860px; }

  .back {
    display: inline-block; margin-bottom: 20px;
    color: var(--sub); font-size: 14px; text-decoration: none;
  }
  .back:hover { color: var(--accent); }

  .detail { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .detail-cover { position: relative; aspect-ratio: 16/7; background: var(--panel-2); border-bottom: 1px solid var(--line); overflow: hidden; }
  .detail-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .detail-cover .cover-ph {
    width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
    color: var(--dim); font-size: 14px;
  }

  .detail-body { padding: 28px 30px 32px; }
  .detail-title {
    font-family: Consolas, "Courier New", "PingFang SC", monospace;
    font-size: 24px; letter-spacing: 1px; color: var(--text); margin-bottom: 14px;
  }
  .detail-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; }
  .detail-note { color: var(--sub); line-height: 1.9; font-size: 15px; }
  .detail-note p { margin-bottom: 14px; }

  .detail-sub {
    font-family: Consolas, "Courier New", "PingFang SC", monospace;
    font-size: 13px; letter-spacing: 2px; color: var(--accent);
    margin: 26px 0 12px;
  }
  .detail-photos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .detail-photos img { width: 100%; aspect-ratio: 4/3; object-fit: cover; border-radius: 8px; display: block; }
  .detail-photos .ph {
    aspect-ratio: 4/3; border-radius: 8px; background: var(--panel-2);
    border: 1px dashed var(--line); display: flex; align-items: center; justify-content: center;
    color: var(--dim); font-size: 12px;
  }
  .detail-videos video {
    width: 100%; max-height: 420px; border-radius: 8px; background: #000;
    border: 1px solid var(--line); margin-bottom: 12px;
  }
  .detail-empty {
    border-radius: 8px; background: var(--panel-2); border: 1px dashed var(--line);
    padding: 24px; text-align: center; color: var(--dim); font-size: 13px;
  }

  @media (max-width: 768px) {
    .detail-photos { grid-template-columns: 1fr; }
    .detail-body { padding: 20px 18px 24px; }
    .detail-title { font-size: 20px; }
  }
</style>
</head>

<script>
(function () {
  var box = document.getElementById('detail');
  var id = new URLSearchParams(location.search).get('id');

  function fmtDate(d) { return d.replace(/-/g, '.'); }

  function noteHTML(note) {
    return note.split('\n').filter(function (s) { return s.trim(); })
      .map(function (s) { return '<p>' + s + '</p>'; }).join('');
  }

  function render(act) {
    var cover = act.cover
      ? '<img src="' + act.cover + '" alt="' + act.title + '">'
      : '<div class="cover-ph">封面待补充</div>';

    var photos = act.photos && act.photos.length
      ? act.photos.map(function (p) { return '<img src="' + p + '" alt="" loading="lazy">'; }).join('')
      : '<div class="detail-empty">照片待补充</div>';

    var videos = act.videos && act.videos.length
      ? act.videos.map(function (v) {
          return '<video controls preload="metadata" ' + (v.poster ? 'poster="' + v.poster + '"' : '') + '>'
            + '<source src="' + v.src + '" type="video/mp4">'
            + '你的浏览器不支持视频播放</video>';
        }).join('')
      : '<div class="detail-empty">视频待补充</div>';

    box.innerHTML = '<article class="detail">'
      + '<div class="detail-cover">' + cover + '</div>'
      + '<div class="detail-body">'
      + '<h1 class="detail-title">' + act.title + '</h1>'
      + '<div class="detail-meta">'
      + '<span class="tag">📅 ' + fmtDate(act.date) + '</span>'
      + '<span class="tag">📍 ' + act.location + '</span>'
      + '<span class="tag">🌤 ' + act.weather + '</span>'
      + '</div>'
      + '<div class="detail-note">' + noteHTML(act.note || '') + '</div>'
      + '<div class="detail-sub">照片</div>'
      + '<div class="detail-photos">' + photos + '</div>'
      + '<div class="detail-sub">视频</div>'
      + '<div class="detail-videos">' + videos + '</div>'
      + '</div></article>';
  }

  fetch('activities.json')
    .then(function (r) { return r.json(); })
    .then(function (acts) {
      var act = acts.find(function (a) { return a.id === id; });
      if (act) { render(act); }
      else { box.innerHTML = '<div class="detail-empty">活动不存在或已删除</div>'; }
    })
    .catch(function () {
      box.innerHTML = '<div class="detail-empty">数据加载失败，请稍后再试</div>';
    });
})();
</script>
