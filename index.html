<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>董怀昊 | 个人主页</title>
<meta name="description" content="北京航空航天大学飞行器适航技术方向研究生，航空发动机无损探伤与故障诊断，户外领队。">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: linear-gradient(180deg, #0a1120 0%, #131c30 60%, #161223 100%);
    color: #e9e6e0;
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    overflow: hidden;
  }
  #sky {
    position: fixed;
    inset: 0;
    z-index: 0;
    display: block;
  }
  #stage {
    position: fixed;
    inset: 0;
    z-index: 1;
    display: block;
    cursor: crosshair;
  }
  .info {
    position: fixed;
    left: 0; right: 0;
    bottom: 64px;
    z-index: 2;
    text-align: center;
    pointer-events: none;
  }
  .info h2 {
    font-size: 22px;
    font-weight: 500;
    letter-spacing: 8px;
    color: #e9e6e0;
    text-shadow: 0 1px 8px rgba(0,0,0,0.6);
  }
  .info .role {
    margin-top: 10px;
    font-size: 14px;
    letter-spacing: 1px;
    color: #a5acbd;
    text-shadow: 0 1px 6px rgba(0,0,0,0.6);
  }
  .info .links {
    margin-top: 18px;
    pointer-events: auto;
  }
  .info .links a {
    display: inline-block;
    font-size: 13px;
    letter-spacing: 1px;
    color: #c9a26b;
    text-decoration: none;
    border: 1px solid rgba(201, 162, 107, 0.5);
    border-radius: 999px;
    padding: 6px 20px;
    transition: all .15s;
  }
  .info .links a:hover {
    background: #c9a26b;
    color: #0a0e14;
  }
  @media (max-width: 600px) {
    .info { bottom: 40px; }
    .info h2 { font-size: 18px; letter-spacing: 5px; }
  }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<canvas id="stage"></canvas>
<div class="info">
  <h2>董怀昊</h2>
  <p class="role">北京航空航天大学 · 飞行器适航技术</p>
  <div class="links">
    <a href="https://github.com/HuaihaoDong" target="_blank" rel="noopener">GitHub</a>
  </div>
</div>
<script>
(function () {
  // ===== 星空层 =====
  var sky = document.getElementById('sky');
  var sctx = sky.getContext('2d');
  var w, h;
  var galaxy = null;
  var stars = [];
  var time = 0;

  function buildGalaxy() {
    var off = document.createElement('canvas');
    off.width = w; off.height = h;
    var octx = off.getContext('2d');
    var x1 = w * 0.18, y1 = h * 0.92;
    var x2 = w * 0.82, y2 = h * 0.08;
    var dx = x2 - x1, dy = y2 - y1;
    var len = Math.sqrt(dx * dx + dy * dy);
    var nx = -dy / len, ny = dx / len;

    for (var i = 0; i < 2400; i++) {
      var t = Math.random();
      var cx = x1 + dx * t;
      var cy = y1 + dy * t;
      var spread = (Math.random() + Math.random() + Math.random() - 1.5) * h * 0.16;
      var px = cx + nx * spread;
      var py = cy + ny * spread;
      var r = Math.random() * 3.2 + 0.6;
      var a = Math.random() * 0.15;
      var warm = Math.random() < 0.28;
      octx.fillStyle = warm
        ? 'rgba(224, 185, 160, ' + a.toFixed(3) + ')'
        : 'rgba(150, 165, 215, ' + a.toFixed(3) + ')';
      octx.beginPath();
      octx.arc(px, py, r, 0, Math.PI * 2);
      octx.fill();
    }
    return off;
  }

  function starColor(big) {
    if (big) {
      return Math.random() < 0.6 ? '235,240,255' : '190,210,255';
    }
    var r = Math.random();
    if (r < 0.70) return '255,255,255';
    if (r < 0.85) return '175,195,255';
    if (r < 0.95) return '255,220,180';
    return '205,175,235';
  }

  function buildStars() {
    stars = [];
    var n = Math.round(Math.min(w, h) / 3); // 略加密
    for (var i = 0; i < n; i++) {
      var big = Math.random() < 0.08; // 8% 亮星，更清晰的点缀
      stars.push({
        x: Math.random() * w,
        y: Math.random() * h,
        r: big ? Math.random() * 1.2 + 1.6 : Math.random() * 1.3 + 0.6,
        phase: Math.random() * Math.PI * 2,
        speed: Math.random() * 0.025 + 0.006,
        color: starColor(big),
        base: big ? 0.55 : 0.32
      });
    }
  }

  function resize() {
    w = sky.width = window.innerWidth;
    h = sky.height = window.innerHeight;
    galaxy = buildGalaxy();
    buildStars();
  }
  resize();
  window.addEventListener('resize', resize);

  function skyFrame() {
    sctx.clearRect(0, 0, w, h);
    sctx.drawImage(galaxy, 0, 0);
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      var a = s.base + 0.6 * (Math.sin(time * s.speed + s.phase) + 1) / 2;
      if (a > 1) a = 1;
      if (a < 0.05) a = 0.05;
      sctx.fillStyle = 'rgba(' + s.color + ',' + a.toFixed(3) + ')';
      sctx.beginPath();
      sctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); // 圆点更清晰
      sctx.fill();
    }
    time += 0.02;
    requestAnimationFrame(skyFrame);
  }
  skyFrame();

  // ===== 粒子文字层 =====
  var canvas = document.getElementById('stage');
  var ctx = canvas.getContext('2d');
  var fs, gap, charSize;
  var text = 'Tiger Captain';
  var particles = [];
  var mouse = { x: -9999, y: -9999 };
  var radius = 110;

  var c1 = [0xe0, 0xa8, 0x78];
  var c2 = [0x8a, 0x7a, 0xb0];

  function lerpColor(k) {
    var r = Math.round(c1[0] + (c2[0] - c1[0]) * k);
    var g = Math.round(c1[1] + (c2[1] - c1[1]) * k);
    var b = Math.round(c1[2] + (c2[2] - c1[2]) * k);
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }

  function build() {
    canvas.width = w;
    canvas.height = h;

    fs = 200;
    do {
      ctx.font = 'bold ' + fs + 'px Consolas, "Courier New", monospace';
      if (ctx.measureText(text).width <= w * 0.86) break;
      fs -= 2;
    } while (fs > 12);

    gap = Math.max(3, Math.round(fs / 26));
    charSize = gap * 1.6;

    var off = document.createElement('canvas');
    off.width = w; off.height = h;
    var octx = off.getContext('2d');
    octx.font = 'bold ' + fs + 'px Consolas, "Courier New", monospace';
    octx.fillStyle = '#fff';
    octx.textAlign = 'center';
    octx.textBaseline = 'middle';
    var cx = w / 2;
    var cy = h * 0.40;
    octx.fillText(text, cx, cy);

    var data = octx.getImageData(0, 0, w, h).data;
    particles = [];
    for (var y = 0; y < h; y += gap) {
      for (var x = 0; x < w; x += gap) {
        var idx = (y * w + x) * 4 + 3;
        if (data[idx] > 128) {
          particles.push({
            tx: x, ty: y,
            x: Math.random() * w, y: Math.random() * h,
            ch: Math.random() < 0.5 ? '0' : '1',
            color: lerpColor(x / w)
          });
        }
      }
    }
  }

  build();
  window.addEventListener('resize', build);

  window.addEventListener('mousemove', function (e) {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });
  window.addEventListener('touchmove', function (e) {
    if (e.touches.length) {
      mouse.x = e.touches[0].clientX;
      mouse.y = e.touches[0].clientY;
    }
  }, { passive: true });

  function stageFrame() {
    ctx.clearRect(0, 0, w, h);
    ctx.font = charSize + 'px Consolas, "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];

      var dx = p.x - mouse.x;
      var dy = p.y - mouse.y;
      var d2 = dx * dx + dy * dy;
      if (d2 < radius * radius && d2 > 0.01) {
        var d = Math.sqrt(d2);
        var f = (radius - d) / radius;
        p.x += (dx / d) * f * 26;
        p.y += (dy / d) * f * 26;
        p.ch = Math.random() < 0.5 ? '0' : '1';
      }

      p.x += (p.tx - p.x) * 0.08;
      p.y += (p.ty - p.y) * 0.08;

      if (Math.random() < 0.02) p.ch = Math.random() < 0.5 ? '0' : '1';

      ctx.fillStyle = p.color;
      ctx.fillText(p.ch, p.x, p.y);
    }
    requestAnimationFrame(stageFrame);
  }
  stageFrame();
})();
</script>
</body>
</html>
