<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: linear-gradient(180deg, #0a1120 0%, #131c30 60%, #161223 100%);
    color: #e9e6e0;
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    overflow: hidden;
  }
  #galaxy, #sky {
    position: fixed;
    inset: 0;
    z-index: 0;
    display: block;
  }
  #stage {
    position: fixed;
    inset: 0;
    z-index: 1;
    display: block;
    cursor: crosshair;
  }
  .info {
    position: fixed;
    left: 0; right: 0;
    bottom: 64px;
    z-index: 2;
    text-align: center;
    pointer-events: none;
  }
  .info h2 {
    font-size: 22px;
    font-weight: 500;
    letter-spacing: 8px;
    color: #e9e6e0;
    text-shadow: 0 1px 8px rgba(0,0,0,0.6);
  }
  .info .role {
    margin-top: 10px;
    font-size: 14px;
    letter-spacing: 1px;
    color: #a5acbd;
    text-shadow: 0 1px 6px rgba(0,0,0,0.6);
  }
  .info .name-link, .info .leader-link { pointer-events: auto; }
  .name-link { display: inline-block; text-decoration: none; color: inherit; }
  .name-link h2 { transition: color .15s; }
  .name-link:hover h2 { color: #c9a26b; }
  .leader-link {
    display: inline-block;
    margin-top: 14px;
    font-size: 13px;
    letter-spacing: 1px;
    color: #c9a26b;
    text-decoration: none;
    border: 1px solid rgba(201, 162, 107, 0.4);
    border-radius: 999px;
    padding: 4px 16px;
    transition: all .15s;
  }
  .leader-link:hover { background: #c9a26b; color: #0a0e14; }
  .info .links {
    margin-top: 18px;
    pointer-events: auto;
  }
  .info .links a {
    display: inline-block;
    font-size: 13px;
    letter-spacing: 1px;
    color: #c9a26b;
    text-decoration: none;
    border: 1px solid rgba(201, 162, 107, 0.5);
    border-radius: 999px;
    padding: 6px 20px;
    transition: all .15s;
  }
  .info .links a:hover {
    background: #c9a26b;
    color: #0a0e14;
  }
  @media (max-width: 600px) {
    .info { bottom: 32px; }
    .info h2 { font-size: 20px; letter-spacing: 6px; }
  }
  @media (max-width: 600px) and (orientation: portrait) {
    #stage { cursor: default; }
    .info {
      top: auto; bottom: max(40px, env(safe-area-inset-bottom)); padding: 0 24px;
      display: grid; grid-template-columns: auto auto; justify-content: center; column-gap: 12px;
    }
    .info .name-link, .info .role { grid-column: 1 / -1; }
    .info .role { margin-top: 8px; font-size: 13px; }
    .info .leader-link, .info .links { margin-top: 18px; }
    .info .leader-link, .info .links a { padding: 8px 14px; font-size: 12px; line-height: 1.4; }
  }
  @media (max-height: 559px) and (max-width: 900px) {
    .info { bottom: 18px; }
    .info h2 { font-size: 18px; letter-spacing: 5px; }
    .info .role { margin-top: 6px; font-size: 12px; }
    .info .leader-link { margin-top: 10px; }
    .info .links { margin-top: 10px; }
  }
  @media (max-width: 600px) and (orientation: portrait) and (max-height: 559px) {
    .info { top: auto; bottom: max(20px, env(safe-area-inset-bottom)); }
  }
</style>
