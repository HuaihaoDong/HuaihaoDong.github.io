<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>董怀昊 | 个人主页</title>
<meta name="description" content="北京航空航天大学飞行器适航技术方向研究生，航空发动机无损探伤与故障诊断，户外领队。">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #060a12;
    color: #eaf1ff;
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    overflow: hidden;
  }
  #stage {
    position: fixed;
    inset: 0;
    z-index: 0;
    display: block;
    cursor: crosshair;
  }
  .info {
    position: fixed;
    left: 0; right: 0;
    bottom: 64px;
    z-index: 1;
    text-align: center;
    pointer-events: none;
  }
  .info h2 {
    font-size: 22px;
    font-weight: 500;
    letter-spacing: 8px;
    color: #eaf1ff;
  }
  .info .role {
    margin-top: 10px;
    font-size: 14px;
    letter-spacing: 1px;
    color: #7d89ad;
  }
  .info .links {
    margin-top: 18px;
    pointer-events: auto;
  }
  .info .links a {
    display: inline-block;
    font-size: 13px;
    letter-spacing: 1px;
    color: #8b7bff;
    text-decoration: none;
    border: 1px solid rgba(139, 123, 255, 0.5);
    border-radius: 999px;
    padding: 6px 20px;
    transition: all .15s;
  }
  .info .links a:hover {
    background: #8b7bff;
    color: #0a0814;
  }
  @media (max-width: 600px) {
    .info { bottom: 40px; }
    .info h2 { font-size: 18px; letter-spacing: 5px; }
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="info">
  <h2>董怀昊</h2>
  <p class="role">北京航空航天大学 · 飞行器适航技术</p>
  <div class="links">
    <a href="https://github.com/HuaihaoDong" target="_blank" rel="noopener">GitHub</a>
  </div>
</div>
<script>
(function () {
  var canvas = document.getElementById('stage');
  var ctx = canvas.getContext('2d');
  var w, h, fs, gap, charSize;
  var text = 'Tiger Captain';
  var particles = [];
  var mouse = { x: -9999, y: -9999 };
  var radius = 110;   // 鼠标影响半径（px）

  // 极光渐变两端：青绿 -> 蓝紫
  var c1 = [0x4e, 0xf0, 0xbd];
  var c2 = [0x7a, 0x6b, 0xff];
  var time = 0;

  // 预计算颜色查找表，避免每帧拼字符串
  var LUT_N = 128;
  var LUT = [];
  for (var j = 0; j < LUT_N; j++) {
    var k = j / (LUT_N - 1);
    var r = Math.round(c1[0] + (c2[0] - c1[0]) * k);
    var g = Math.round(c1[1] + (c2[1] - c1[1]) * k);
    var b = Math.round(c1[2] + (c2[2] - c1[2]) * k);
    LUT[j] = 'rgb(' + r + ',' + g + ',' + b + ')';
  }

  function build() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;

    fs = 200;
    do {
      ctx.font = 'bold ' + fs + 'px Consolas, "Courier New", monospace';
      if (ctx.measureText(text).width <= w * 0.86) break;
      fs -= 2;
    } while (fs > 12);

    gap = Math.max(3, Math.round(fs / 26));
    charSize = gap * 1.6;

    var off = document.createElement('canvas');
    off.width = w; off.height = h;
    var octx = off.getContext('2d');
    octx.font = 'bold ' + fs + 'px Consolas, "Courier New", monospace';
    octx.fillStyle = '#fff';
    octx.textAlign = 'center';
    octx.textBaseline = 'middle';
    var cx = w / 2;
    var cy = h * 0.40;
    octx.fillText(text, cx, cy);

    var data = octx.getImageData(0, 0, w, h).data;
    particles = [];
    for (var y = 0; y < h; y += gap) {
      for (var x = 0; x < w; x += gap) {
        var idx = (y * w + x) * 4 + 3;
        if (data[idx] > 128) {
          particles.push({
            tx: x, ty: y,
            x: Math.random() * w, y: Math.random() * h,
            ch: Math.random() < 0.5 ? '0' : '1',
            phase: Math.random() * Math.PI * 2
          });
        }
      }
    }
  }

  build();
  window.addEventListener('resize', build);

  window.addEventListener('mousemove', function (e) {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });
  window.addEventListener('touchmove', function (e) {
    if (e.touches.length) {
      mouse.x = e.touches[0].clientX;
      mouse.y = e.touches[0].clientY;
    }
  }, { passive: true });

  function frame() {
    ctx.fillStyle = 'rgba(6, 10, 18, 0.22)';
    ctx.fillRect(0, 0, w, h);
    ctx.font = charSize + 'px Consolas, "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    time += 0.008;

    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];

      // 鼠标排斥
      var dx = p.x - mouse.x;
      var dy = p.y - mouse.y;
      var d2 = dx * dx + dy * dy;
      if (d2 < radius * radius && d2 > 0.01) {
        var d = Math.sqrt(d2);
        var f = (radius - d) / radius;
        p.x += (dx / d) * f * 26;
        p.y += (dy / d) * f * 26;
        p.ch = Math.random() < 0.5 ? '0' : '1';
      }

      p.x += (p.tx - p.x) * 0.08;
      p.y += (p.ty - p.y) * 0.08;

      if (Math.random() < 0.02) p.ch = Math.random() < 0.5 ? '0' : '1';

      // 极光：颜色随时间 + 相位流动
      var t = (Math.sin(time + p.phase) + 1) / 2;
      ctx.fillStyle = LUT[Math.round(t * (LUT_N - 1))];
      ctx.fillText(p.ch, p.x, p.y);
    }
    requestAnimationFrame(frame);
  }
  frame();
})();
</script>
</body>
</html>
