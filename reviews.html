  :root {
    --bg: #0B1120; --panel: #141d33; --panel-2: #1a2540;
    --line: #2a3a55; --accent: #c9a26b; --text: #e9e6e0;
    --sub: #a5acbd; --dim: #6b7488;
  }
  html, body { overflow-x: hidden; }
  body::before {
    content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      radial-gradient(1px 1px at 10% 18%, rgba(220,232,255,.5) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 30% 8%, rgba(240,244,255,.35) 50%, transparent 51%),
      radial-gradient(1px 1px at 50% 30%, rgba(220,232,255,.4) 50%, transparent 51%),
      radial-gradient(2px 2px at 72% 14%, rgba(186,208,255,.3) 50%, transparent 51%),
      radial-gradient(1px 1px at 88% 40%, rgba(240,244,255,.45) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 18% 70%, rgba(220,232,255,.35) 50%, transparent 51%),
      radial-gradient(1px 1px at 40% 88%, rgba(240,244,255,.4) 50%, transparent 51%),
      radial-gradient(1px 1px at 62% 60%, rgba(220,232,255,.3) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 80% 82%, rgba(186,208,255,.35) 50%, transparent 51%),
      radial-gradient(1px 1px at 94% 60%, rgba(240,244,255,.4) 50%, transparent 51%);
  }
  .section { position: relative; z-index: 1; padding-top: 100px; max-width: 720px; }

  .back { display: inline-block; margin-bottom: 20px; color: var(--sub); font-size: 14px; text-decoration: none; }
  .back:hover { color: var(--accent); }
  .page-title {
    font-family: Consolas, "Courier New", "PingFang SC", monospace;
    font-size: 30px; letter-spacing: 3px; color: var(--text); margin-bottom: 8px;
  }
  .page-sub { color: var(--sub); font-size: 15px; margin-bottom: 32px; }

  /* 评价图片列表：统一宽度，居中 */
  .review-list { display: flex; flex-direction: column; gap: 22px; }
  .review-item {
    width: 100%; max-width: 560px; margin: 0 auto;
    background: #fff; border-radius: 12px; overflow: hidden;
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
  }
  .review-item img { width: 100%; display: block; }

  .page-foot { text-align: center; color: var(--dim); font-size: 13px; padding: 24px 0 40px; }

  @media (max-width: 768px) {
    .page-title { font-size: 24px; }
  }
</style>

<script src="nav.js"></script>

<script>
(function () {
  var list = document.getElementById('reviewList');
  fetch('reviews.json')
    .then(function (r) { return r.json(); })
    .then(function (items) {
      list.innerHTML = items.map(function (src) {
        return '<div class="review-item"><img src="' + src + '" alt="评价" loading="lazy"></div>';
      }).join('');
    })
    .catch(function () {
      list.innerHTML = '<p class="page-foot">评价数据加载失败，请稍后再试。</p>';
    });
})();
</script>
