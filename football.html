<style>
  :root {
    --bg: #0B1120; --panel: #141d33; --panel-2: #1a2540;
    --line: #2a3a55; --accent: #c9a26b; --text: #e9e6e0;
    --sub: #a5acbd; --dim: #6b7488;
  }
  html, body { overflow-x: hidden; }
  body::before {
    content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      radial-gradient(1px 1px at 10% 18%, rgba(220,232,255,.5) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 30% 8%, rgba(240,244,255,.35) 50%, transparent 51%),
      radial-gradient(1px 1px at 50% 30%, rgba(220,232,255,.4) 50%, transparent 51%),
      radial-gradient(2px 2px at 72% 14%, rgba(186,208,255,.3) 50%, transparent 51%),
      radial-gradient(1px 1px at 88% 40%, rgba(240,244,255,.45) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 18% 70%, rgba(220,232,255,.35) 50%, transparent 51%),
      radial-gradient(1px 1px at 40% 88%, rgba(240,244,255,.4) 50%, transparent 51%),
      radial-gradient(1px 1px at 62% 60%, rgba(220,232,255,.3) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 80% 82%, rgba(186,208,255,.35) 50%, transparent 51%),
      radial-gradient(1px 1px at 94% 60%, rgba(240,244,255,.4) 50%, transparent 51%);
  }
  .section { position: relative; z-index: 1; padding-top: 112px; max-width: 1080px; }

  .back { display: inline-block; margin-bottom: 20px; color: var(--sub); font-size: 14px; text-decoration: none; }
  .back:hover { color: var(--accent); }
  .page-head { margin-bottom: 36px; }
  .page-title {
    font-family: Consolas, "Courier New", "PingFang SC", monospace;
    font-size: 30px; letter-spacing: 3px; color: var(--text);
  }
  .page-sub { margin-top: 12px; color: var(--sub); font-size: 15px; }

  /* 分区标题 */
  .fb-block { margin-bottom: 44px; }
  .fb-title {
    font-family: Consolas, "Courier New", "PingFang SC", monospace;
    font-size: 20px; letter-spacing: 2px; color: var(--text);
    margin-bottom: 6px;
  }
  .fb-title .en { color: var(--accent); font-size: 13px; letter-spacing: 2px; margin-right: 8px; }
  .fb-desc { color: var(--dim); font-size: 13px; margin-bottom: 14px; }

  /* 照片条：横向滑动 + 单击放大 */
  .strip {
    display: flex; gap: 12px; overflow-x: auto;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    padding: 4px 4px 14px;
    margin: 0 -4px;
  }
  .strip .ph-item {
    flex: 0 0 230px;
    scroll-snap-align: start;
  }
  .strip .ph-item img {
    width: 100%; aspect-ratio: 4/3; object-fit: cover;
    border-radius: 10px; border: 1px solid var(--line);
    cursor: zoom-in; display: block;
    transition: opacity .15s;
  }
  .strip .ph-item img:hover { opacity: .88; }
  .strip .ph {
    width: 100%; aspect-ratio: 4/3; border-radius: 10px;
    background: var(--panel-2); border: 1px dashed var(--line);
    display: flex; align-items: center; justify-content: center;
    color: var(--dim); font-size: 12px;
  }
  .team-name {
    font-size: 15px; color: var(--sub); margin-bottom: 10px;
  }
  .team-name .mark { color: var(--accent); margin-right: 8px; }

  /* 比赛卡片 */
  .match-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
  .match-card {
    display: block;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
    text-decoration: none; color: inherit;
    transition: transform .18s ease, border-color .18s ease;
  }
  .match-card:hover { transform: translateY(-3px); border-color: var(--accent); }
  .mc-cover { aspect-ratio: 16/9; background: var(--panel-2); border-bottom: 1px solid var(--line); overflow: hidden; }
  .mc-cover img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .35s ease; }
  .match-card:hover .mc-cover img { transform: scale(1.04); }
  .mc-cover .cover-ph {
    width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
    color: var(--dim); font-size: 13px;
  }
  .mc-info { padding: 14px 16px 16px; }
  .mc-title {
    font-family: Consolas, "Courier New", "PingFang SC", monospace;
    font-size: 16px; letter-spacing: 1px; color: var(--text); margin-bottom: 8px;
  }
  .mc-row { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  .mc-date { color: var(--dim); font-size: 13px; }
  .mc-score {
    font-family: Consolas, "Courier New", "PingFang SC", monospace;
    color: var(--accent); font-size: 15px; letter-spacing: 1px;
    border: 1px solid rgba(201, 162, 107, 0.5);
    border-radius: 6px; padding: 1px 10px;
  }
  .match-cat { margin: 0 0 12px; }

  .fb-empty {
    border-radius: 10px; background: var(--panel-2); border: 1px dashed var(--line);
    padding: 36px 24px; text-align: center; color: var(--dim); font-size: 13px;
  }

  @media (max-width: 768px) {
    .page-title { font-size: 24px; }
    .strip .ph-item { flex: 0 0 200px; }
    .match-grid { grid-template-columns: 1fr; }
  }
</style>
</head>

    <h1 class="page-title">足球</h1>
    <p class="page-sub">绿茵场上的十一年：从校队队长到自办联赛，和一群最好的伙伴。</p>
  </header>

  <!-- 精彩瞬间（顶部照片条） -->

    <h2 class="fb-title"><span class="en">MOMENTS</span>精彩瞬间</h2>

    <div class="strip" id="topStrip"></div>
  </section>

  <!-- 最好的搭档 -->
  <section class="fb-block">
    <h2 class="fb-title"><span class="en">PARTNER</span>最好的搭档</h2>
    <p class="fb-desc">点击照片放大查看</p>
    <div id="partnerBox"></div>
  </section>

  <!-- 最好的队友 -->
  <section class="fb-block">
    <h2 class="fb-title"><span class="en">TEAMMATES</span>最好的队友</h2>
    <p class="fb-desc">每一支一起战斗过的球队</p>
    <div id="teammatesBox"></div>
  </section>

  <!-- 比赛 -->
  <section class="fb-block">
    <h2 class="fb-title"><span class="en">MATCHES</span>比赛记录</h2>
    <div class="match-cat" id="officialBox"></div>
    <div id="friendlyBox"></div>
  </section>

<script src="nav.js"></script>
<script src="tiger.js"></script>
<script src="album.js"></script>
<script>
(function () {
  var topStrip = document.getElementById('topStrip');
  var partnerBox = document.getElementById('partnerBox');
  var teammatesBox = document.getElementById('teammatesBox');
  var officialBox = document.getElementById('officialBox');
  var friendlyBox = document.getElementById('friendlyBox');

  function fmtDate(d) { return d.replace(/-/g, '.'); }

  // 照片条目 → {src, thumb}（兼容字符串）
  function photoInfo(p) {
    if (typeof p === 'string' && p) return { src: p, thumb: p };
    if (p && typeof p.src === 'string' && p.src) {
      return { src: p.src, thumb: (p.thumb && typeof p.thumb === 'string') ? p.thumb : p.src };
    }
    return null;
  }

  function imgHTML(p, alt) {
    return '<div class="ph-item"><img src="' + p.thumb + '" data-full="' + p.src + '" alt="' + (alt || '') + '" loading="lazy"></div>';
  }

  function placeholderHTML(n, text) {
    var html = '';
    for (var i = 0; i < n; i++) {
      html += '<div class="ph-item"><div class="ph">' + text + '</div></div>';
    }
    return html;
  }

  // 照片条：有图渲染图，没图放 n 个占位
  function renderStrip(container, photos, placeholderCount, placeholderText) {
    var list = (photos || []).map(photoInfo).filter(function (x) { return x; });
    container.innerHTML = list.length
      ? list.map(function (p) { return imgHTML(p); }).join('')
      : placeholderHTML(placeholderCount, placeholderText);
    if (list.length) {
      Album.init(container, { masonry: false });
    }
  }

  // 比赛卡片（按正赛/友谊赛分组）
  function matchCardHTML(m) {
    var cover = m.cover
      ? '<img src="' + m.cover + '" alt="' + m.title + '" loading="lazy">'
      : '<div class="cover-ph">封面待补充</div>';
    return '<a class="match-card" href="detail.html?id=' + encodeURIComponent(m.id) + '&data=football-matches.json&back=football.html">'
      + '<div class="mc-cover">' + cover + '</div>'
      + '<div class="mc-info">'
      + '<h3 class="mc-title">' + m.title + '</h3>'
      + '<div class="mc-row">'
      + '<span class="mc-date">📅 ' + fmtDate(m.date) + (m.opponent ? ' · ⚔ ' + m.opponent : '') + '</span>'
      + (m.score ? '<span class="mc-score">' + m.score.replace(':', ' : ') + '</span>' : '')
      + '</div>'
      + '</div></a>';
  }

  // ===== 渲染足球页数据 =====
  fetch('football.json')
    .then(function (r) { return r.json(); })
    .then(function (d) {
      // 顶部照片条
      renderStrip(topStrip, d.topPhotos, 3, '精彩瞬间待补充');
      // 最好的搭档（1 个位置）
      var partner = d.partner || {};
      partnerBox.innerHTML = '<div class="team-name"><span class="mark">⚽</span>' + (partner.name || '最好的搭档') + '</div>'
        + '<div class="strip" data-strip="partner">'
        + ((partner.photos && partner.photos.length)
            ? partner.photos.map(photoInfo).filter(function (x) { return x; }).map(function (p) { return imgHTML(p); }).join('')
            : placeholderHTML(2, '搭档照片待补充'))
        + '</div>';
      var ps = partnerBox.querySelector('.strip');
      if (ps.querySelector('img')) Album.init(ps, { masonry: false });
      // 最好的队友（多支球队）
      var teams = d.teammates && d.teammates.length ? d.teammates : [];
      if (!teams.length) {
        var ph = '';
        for (var i = 0; i < 3; i++) {
          ph += '<div class="team-name"><span class="mark">⚽</span>球队 ' + (i + 1) + ' 待补充</div>'
            + '<div class="strip">' + placeholderHTML(2, '球队合影待补充') + '</div>';
        }
        teammatesBox.innerHTML = ph;
      } else {
        teammatesBox.innerHTML = teams.map(function (t) {
          return '<div class="team-name"><span class="mark">⚽</span>' + t.name + '</div>'
            + '<div class="strip" data-team="' + t.name + '">'
            + ((t.photos && t.photos.length)
                ? t.photos.map(photoInfo).filter(function (x) { return x; }).map(function (p) { return imgHTML(p); }).join('')
                : placeholderHTML(2, '球队合影待补充'))
            + '</div>';
        }).join('');
        var tStrips = teammatesBox.querySelectorAll('.strip');
        for (var j = 0; j < tStrips.length; j++) {
          if (tStrips[j].querySelector('img')) Album.init(tStrips[j], { masonry: false });
        }
      }
    })
    .catch(function () {
      topStrip.innerHTML = placeholderHTML(3, '照片待补充');
    });

  // ===== 比赛记录 =====
  fetch('football-matches.json')
    .then(function (r) { return r.json(); })
    .then(function (matches) {
      var official = matches.filter(function (m) { return m.category === 'official'; });
      var friendly = matches.filter(function (m) { return m.category !== 'official'; });
      officialBox.innerHTML = '<h3 class="team-name"><span class="mark">🏆</span>正赛</h3>'
        + (official.length
            ? '<div class="match-grid">' + official.map(matchCardHTML).join('') + '</div>'
            : '<div class="fb-empty">正赛记录待补充</div>');
      friendlyBox.innerHTML = '<h3 class="team-name" style="margin-top:22px;"><span class="mark">🤝</span>友谊赛</h3>'
        + (friendly.length
            ? '<div class="match-grid">' + friendly.map(matchCardHTML).join('') + '</div>'
            : '<div class="fb-empty">友谊赛记录待补充</div>');
    })
    .catch(function () {
      officialBox.innerHTML = '<div class="fb-empty">比赛数据加载失败，请稍后再试</div>';
    });
})();
</script>
</body>
