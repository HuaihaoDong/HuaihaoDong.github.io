<link rel="stylesheet" href="common.css">
<style>
  /* ===== 本页特有样式 ===== */
  :root {
    --bg: #0B1120; --panel: #141d33; --panel-2: #1a2540;
    --line: #2a3a55; --accent: #c9a26b; --text: #e9e6e0;
    --sub: #a5acbd; --dim: #6b7488;
  }
  html, body { overflow-x: hidden; }
  body::before {
    content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      radial-gradient(1px 1px at 10% 18%, rgba(220,232,255,.5) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 30% 8%, rgba(240,244,255,.35) 50%, transparent 51%),
      radial-gradient(1px 1px at 50% 30%, rgba(220,232,255,.4) 50%, transparent 51%),
      radial-gradient(2px 2px at 72% 14%, rgba(186,208,255,.3) 50%, transparent 51%),
      radial-gradient(1px 1px at 88% 40%, rgba(240,244,255,.45) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 18% 70%, rgba(220,232,255,.35) 50%, transparent 51%),
      radial-gradient(1px 1px at 40% 88%, rgba(240,244,255,.4) 50%, transparent 51%),
      radial-gradient(1px 1px at 62% 60%, rgba(220,232,255,.3) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 80% 82%, rgba(186,208,255,.35) 50%, transparent 51%),
      radial-gradient(1px 1px at 94% 60%, rgba(240,244,255,.4) 50%, transparent 51%);
  }
  .section { position: relative; z-index: 1; padding-top: 112px; }

  /* 页首 */
  .page-head { margin-bottom: 40px; }
  .page-title {
    font-family: Consolas, "Courier New", "PingFang SC", monospace;
    font-size: 30px; letter-spacing: 3px; color: var(--text);
  }
  .page-sub { margin-top: 12px; color: var(--sub); font-size: 15px; }

  /* 活动卡片 */
  .event {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
    margin-bottom: 40px;
  }
  .event-cover {
    aspect-ratio: 16/7;
    background: var(--panel-2);
    border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center;
    color: var(--dim); font-size: 14px;
  }
  .event-body { padding: 26px 28px 30px; }
  .event-title {
    font-family: Consolas, "Courier New", "PingFang SC", monospace;
    font-size: 22px; letter-spacing: 1px; color: var(--text); margin-bottom: 14px;
  }
  .event-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  .event-note {
    color: var(--sub); line-height: 1.85; font-size: 15px; margin-bottom: 24px;
  }
  .event-sub {
    font-family: Consolas, "Courier New", "PingFang SC", monospace;
    font-size: 13px; letter-spacing: 2px; color: var(--accent);
    margin-bottom: 12px;
  }
  /* 照片网格 */
  .event-photos {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 24px;
  }
  .event-photos .ph {
    aspect-ratio: 4/3; border-radius: 8px;
    background: var(--panel-2); border: 1px dashed var(--line);
    display: flex; align-items: center; justify-content: center;
    color: var(--dim); font-size: 12px;
  }
  .event-photos img { width: 100%; aspect-ratio: 4/3; object-fit: cover; border-radius: 8px; display: block; }
  /* 视频 */
  .event-video video {
    width: 100%; max-height: 420px; border-radius: 8px; background: #000;
    border: 1px solid var(--line);
  }
  .video-placeholder {
    aspect-ratio: 16/9; border-radius: 8px;
    background: var(--panel-2); border: 1px dashed var(--line);
    display: flex; align-items: center; justify-content: center;
    color: var(--dim); font-size: 13px; text-align: center; padding: 0 16px;
  }

  /* 底部提示 */
  .page-foot { text-align: center; color: var(--dim); font-size: 13px; padding: 20px 0 40px; }

  @media (max-width: 768px) {
    .page-title { font-size: 24px; }
    .event-photos { grid-template-columns: 1fr; }
    .event-body { padding: 20px 18px 24px; }
  }
</style>
</head>
