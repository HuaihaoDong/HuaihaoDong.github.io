<html lang="zh-CN">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="description" content="董怀昊（Tiger Captain）作为烛逢户外领队的每一次出发：活动、路线、天气、心得与影像记录。">
<link rel="stylesheet" href="common.css">
<style>
  :root {
    --bg: #0B1120; --panel: #141d33; --panel-2: #1a2540;
    --line: #2a3a55; --accent: #c9a26b; --text: #e9e6e0;
    --sub: #a5acbd; --dim: #6b7488;
  }
  html, body { overflow-x: hidden; }
  body::before {
    content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      radial-gradient(1px 1px at 10% 18%, rgba(220,232,255,.5) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 30% 8%, rgba(240,244,255,.35) 50%, transparent 51%),
      radial-gradient(1px 1px at 50% 30%, rgba(220,232,255,.4) 50%, transparent 51%),
      radial-gradient(2px 2px at 72% 14%, rgba(186,208,255,.3) 50%, transparent 51%),
      radial-gradient(1px 1px at 88% 40%, rgba(240,244,255,.45) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 18% 70%, rgba(220,232,255,.35) 50%, transparent 51%),
      radial-gradient(1px 1px at 40% 88%, rgba(240,244,255,.4) 50%, transparent 51%),
      radial-gradient(1px 1px at 62% 60%, rgba(220,232,255,.3) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 80% 82%, rgba(186,208,255,.35) 50%, transparent 51%),
      radial-gradient(1px 1px at 94% 60%, rgba(240,244,255,.4) 50%, transparent 51%);
  }
  .section { position: relative; z-index: 1; padding-top: 112px; }

  .back { display: inline-block; margin-bottom: 20px; color: var(--sub); font-size: 14px; text-decoration: none; }
  .back:hover { color: var(--accent); }
  .page-head { margin-bottom: 36px; }
  .page-title {
    font-family: Consolas, "Courier New", "PingFang SC", monospace;
    font-size: 30px; letter-spacing: 3px; color: var(--text);
  }
  .page-sub { margin-top: 12px; color: var(--sub); font-size: 15px; }

  /* 活动卡片 */
  .event-card {
    display: block;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
    margin-bottom: 28px;
    text-decoration: none;
    color: inherit;
    transition: transform .18s ease, border-color .18s ease;
  }
  .event-card:hover { transform: translateY(-3px); border-color: var(--accent); }

  .event-cover {
    position: relative;
    aspect-ratio: 16/7;
    background: var(--panel-2);
    border-bottom: 1px solid var(--line);
    overflow: hidden;
  }
  .event-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .event-cover .cover-ph {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    color: var(--dim); font-size: 14px;
  }
  .pin-badge {
    position: absolute; top: 12px; left: 12px;
    background: rgba(11, 17, 32, 0.82);
    color: var(--accent);
    border: 1px solid rgba(201, 162, 107, 0.5);
    border-radius: 999px;
    padding: 3px 12px; font-size: 12px;
  }

  .event-info { padding: 20px 24px 22px; }
  .event-title {
    font-family: Consolas, "Courier New", "PingFang SC", monospace;
    font-size: 20px; letter-spacing: 1px; color: var(--text); margin-bottom: 10px;
  }
  .event-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .event-summary { color: var(--sub); font-size: 14px; line-height: 1.75; }

  .page-foot { text-align: center; color: var(--dim); font-size: 13px; padding: 20px 0 40px; }

  /* 筛选栏 */
  .filter-bar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 24px; }
  .filter-btn {
    padding: 8px 16px; font-size: 14px; font-family: inherit;
    border-radius: 999px; border: 1px solid var(--line);
    background: transparent; color: var(--sub);
    cursor: pointer;
    transition: color .15s, border-color .15s, background .15s;
  }
  .filter-btn:hover { color: var(--text); border-color: var(--accent); }
  .filter-btn.active { color: var(--accent); border-color: rgba(201, 162, 107, 0.5); background: var(--accent-soft); }

  /* 封面右上类型徽章（与左上 pin 对称） */
  .type-badge {
    position: absolute; top: 12px; right: 12px;
    background: rgba(11, 17, 32, 0.82);
    border-radius: 999px; padding: 3px 12px; font-size: 12px;
  }
  .type-hike { color: #7ec48e; border: 1px solid rgba(126, 196, 142, 0.5); }
  .type-play { color: #7fb0ea; border: 1px solid rgba(127, 176, 234, 0.5); }
  .type-trip { color: #aa94e0; border: 1px solid rgba(170, 148, 224, 0.5); }
  .type-camp { color: #e6a060; border: 1px solid rgba(230, 160, 96, 0.5); }

  /* 标题旁「领」徽章 */
  .led-badge {
    display: inline-block; margin-left: 8px; vertical-align: 3px;
    font-size: 12px; padding: 1px 8px; border-radius: 6px;
    color: var(--accent); border: 1px solid rgba(201, 162, 107, 0.5); background: var(--accent-soft);
  }

  /* 封面右下照片数角标 */
  .cover-count {
    position: absolute; bottom: 12px; right: 12px;
    background: rgba(11, 17, 32, 0.82);
    color: var(--sub); border: 1px solid var(--line);
    border-radius: 999px; padding: 3px 12px; font-size: 12px;
  }

  /* 封面 hover 微放大 */
  .event-cover img { transition: transform .35s ease; }
  .event-card:hover .event-cover img { transform: scale(1.04); }

  /* 筛选空状态 */
  .filter-empty {
    border-radius: 8px; background: var(--panel-2); border: 1px dashed var(--line);
    padding: 36px 24px; text-align: center; color: var(--dim); font-size: 14px;
  }
  .filter-empty .btn { margin-top: 16px; }

  @media (max-width: 768px) {
    .page-title { font-size: 24px; }
    .event-info { padding: 16px 18px 18px; }
  }
</style>
</head>

<script src="nav.js"></script>
<script src="tiger.js"></script>
<script>
(function () {
  var list = document.getElementById('eventList');
  var filterBar = document.getElementById('filterBar');

  var TYPE_MAP = {
    Hike: { label: '徒步', cls: 'type-hike' },
    Play: { label: '玩耍', cls: 'type-play' },
    Trip: { label: '旅行', cls: 'type-trip' },
    Camp: { label: '露营', cls: 'type-camp' }
  };

  var filter = { type: 'all', led: false };
  var allActs = [];

  function fmtDate(d) { return d.replace(/-/g, '.'); }

  function typeBadgeHTML(a) {
    var t = TYPE_MAP[a.type];
    return t ? '<span class="type-badge ' + t.cls + '">' + t.label + '</span>' : '';
  }

  function ledBadgeHTML(a) {
    return a.led ? '<span class="led-badge">领</span>' : '';
  }

  function coverCountHTML(a) {
    var n = a.photos && a.photos.length;
    return n ? '<span class="cover-count">' + n + ' 张</span>' : '';
  }

  function cardHTML(a) {
    var pin = a.pinned ? '<span class="pin-badge">📌 置顶</span>' : '';
    var cover = a.cover
      ? '<img src="' + a.cover + '" alt="' + a.title + '" loading="lazy">'
      : '<div class="cover-ph">封面待补充</div>';
    return '<a class="event-card" href="detail.html?id=' + encodeURIComponent(a.id) + '">'
      + '<div class="event-cover">' + pin + typeBadgeHTML(a) + cover + coverCountHTML(a) + '</div>'
      + '<div class="event-info">'
      + '<h2 class="event-title">' + a.title + ledBadgeHTML(a) + '</h2>'
      + '<div class="event-meta">'
      + '<span class="tag">📅 ' + fmtDate(a.date) + '</span>'
      + '<span class="tag">📍 ' + a.location + '</span>'
      + '<span class="tag">🌤 ' + a.weather + '</span>'
      + '</div>'
      + '<p class="event-summary">' + a.summary + '</p>'
      + '</div></a>';
  }

  function matches(a) {
    return (filter.type === 'all' || a.type === filter.type)
        && (!filter.led || a.led === true);
  }

  function syncFilterUI() {
    var btns = filterBar.querySelectorAll('.filter-btn');
    for (var i = 0; i < btns.length; i++) {
      var b = btns[i];
      if (b.id === 'ledBtn') { b.classList.toggle('active', filter.led); }
      else { b.classList.toggle('active', b.getAttribute('data-type') === filter.type); }
    }
  }

  function renderList() {
    var byDate = function (x, y) { return y.date < x.date ? -1 : 1; };
    var filtered = allActs.filter(matches);
    if (!filtered.length) {
      list.innerHTML = '<div class="filter-empty">没有符合条件的活动'
        + '<br><button class="btn" id="resetFilter">查看全部</button></div>';
      return;
    }
    var pinned = filtered.filter(function (a) { return a.pinned; }).sort(byDate);
    var normal = filtered.filter(function (a) { return !a.pinned; }).sort(byDate);
    list.innerHTML = pinned.concat(normal).map(cardHTML).join('');
  }

  fetch('activities.json')
    .then(function (r) { return r.json(); })
    .then(function (acts) {
      allActs = acts;
      renderList();
    })
    .catch(function () {
      list.innerHTML = '<p class="page-foot">活动数据加载失败，请稍后再试。</p>';
    });

  filterBar.addEventListener('click', function (e) {
    var btn = e.target.closest('.filter-btn');
    if (!btn) return;
    if (btn.id === 'ledBtn') {
      filter.led = !filter.led;
    } else {
      filter.type = btn.getAttribute('data-type');
    }
    syncFilterUI();
    renderList();
  });

  document.addEventListener('click', function (e) {
    if (e.target.id === 'resetFilter') {
      filter = { type: 'all', led: false };
      syncFilterUI();
      renderList();
    }
  });
})();
</script>
