<style>
  :root {
    --bg: #0B1120; --panel: #141d33; --panel-2: #1a2540;
    --line: #2a3a55; --accent: #c9a26b; --text: #e9e6e0;
    --sub: #a5acbd; --dim: #6b7488;
  }
  html, body { overflow-x: hidden; }
  body::before {
    content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      radial-gradient(1px 1px at 10% 18%, rgba(220,232,255,.5) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 30% 8%, rgba(240,244,255,.35) 50%, transparent 51%),
      radial-gradient(1px 1px at 50% 30%, rgba(220,232,255,.4) 50%, transparent 51%),
      radial-gradient(2px 2px at 72% 14%, rgba(186,208,255,.3) 50%, transparent 51%),
      radial-gradient(1px 1px at 88% 40%, rgba(240,244,255,.45) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 18% 70%, rgba(220,232,255,.35) 50%, transparent 51%),
      radial-gradient(1px 1px at 40% 88%, rgba(240,244,255,.4) 50%, transparent 51%),
      radial-gradient(1px 1px at 62% 60%, rgba(220,232,255,.3) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 80% 82%, rgba(186,208,255,.35) 50%, transparent 51%),
      radial-gradient(1px 1px at 94% 60%, rgba(240,244,255,.4) 50%, transparent 51%);
  }
  .section { position: relative; z-index: 1; padding-top: 112px; max-width: 900px; }

  .back { display: inline-block; margin-bottom: 20px; color: var(--sub); font-size: 14px; text-decoration: none; }
  .back:hover { color: var(--accent); }
  .page-head { margin-bottom: 36px; }
  .page-title {
    font-family: Consolas, "Courier New", "PingFang SC", monospace;
    font-size: 30px; letter-spacing: 3px; color: var(--text);
  }
  .page-sub { margin-top: 12px; color: var(--sub); font-size: 15px; }

  /* 瀑布流：照片 + 日期说明，点击放大 */
  .fit-photos { position: relative; }
  .fit-photos .ph-item {
    position: absolute; top: 0; left: 0;
    width: calc((100% - 20px) / 3);
    min-height: 120px;
  }
  .fit-photos .ph-item img {
    width: 100%; height: auto; border-radius: 8px; display: block;
    cursor: zoom-in; transition: opacity .15s;
  }
  .fit-photos .ph-item img:hover { opacity: .88; }
  .fit-photos .ph-date {
    margin-top: 6px; color: var(--dim); font-size: 13px;
    text-align: center; letter-spacing: 0.04em;
  }
  .fit-photos .ph {
    border-radius: 8px; background: var(--panel-2);
    border: 1px dashed var(--line); display: flex; align-items: center; justify-content: center;
    color: var(--dim); font-size: 12px;
    padding: 28px 12px;
  }
  .fit-empty {
    border-radius: 10px; background: var(--panel-2); border: 1px dashed var(--line);
    padding: 48px 24px; text-align: center; color: var(--dim); font-size: 14px;
  }

  @media (max-width: 768px) {
    .page-title { font-size: 24px; }
    .fit-photos .ph-item { width: calc((100% - 10px) / 2); }
  }
</style>
</head>

    <h1 class="page-title">健身</h1>
    <p class="page-sub">功能性训练 · 每一次流汗都有记录</p>
  </header>

  <div class="fit-photos" id="fitWall"></div>
</main>

<script src="nav.js"></script>
<script src="tiger.js"></script>
<script src="album.js"></script>
<script>
(function () {
  var wall = document.getElementById('fitWall');

  function fmtDate(d) { return d ? d.replace(/-/g, '.') : ''; }

  fetch('fitness.json')
    .then(function (r) { return r.json(); })
    .then(function (items) {
      if (!items.length) {
        wall.innerHTML = '<div class="fit-empty">健身成果照片待补充</div>';
        return;
      }
      wall.innerHTML = items.map(function (p, i) {
        var thumb = p.thumb || p.src;
        return '<div class="ph-item">'
          + '<img src="' + thumb + '" data-full="' + p.src + '" alt="健身成果 ' + (i + 1) + '" loading="lazy">'
          + (p.date ? '<div class="ph-date">' + fmtDate(p.date) + '</div>' : '')
          + '</div>';
      }).join('');
      Album.init(wall, { masonry: true });
    })
    .catch(function () {
      wall.innerHTML = '<div class="fit-empty">数据加载失败，请稍后再试</div>';
    });
})();
</script>
